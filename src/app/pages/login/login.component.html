<main class="login-content">
  <h2>Acesse a Laranjinha Store</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
    <div class="input-container">
      <label for="email">e-mail</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" required autocomplete="email" #emailInput="ngModel" (blur)="emailInput.control.markAsTouched(); emailInput.control.updateValueAndValidity()" [ngClass]="{'invalid': !isEmailValid}" />
      <div *ngIf="!isEmailValid && emailInput.touched" class="error-message">
        Por favor, insira um e-mail válido.
      </div>

      <label for="password">senha</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" #passwordInput="ngModel" (blur)="passwordInput.control.markAsTouched(); passwordInput.control.updateValueAndValidity()" [ngClass]="{'invalid': !isPasswordValid}" />
      <div *ngIf="!isPasswordValid && passwordInput.touched" class="error-message">
        A senha deve ter pelo menos 8 caracteres.
      </div>
    </div>

    <div class="buttons-container">
      <button class="button button-secondary" (click)="navigateTo('notice')">Mais tarde</button>
      <button class="button button-primary" type="submit" [disabled]="!isFormValid">entrar</button>
    </div>
  </form>
</main>
<div class="login-links">
  <a href="/forgot-password">esqueci a minha senha</a>
  <a href="/register">ainda não tem uma conta? cadastre-se</a>
</div>
